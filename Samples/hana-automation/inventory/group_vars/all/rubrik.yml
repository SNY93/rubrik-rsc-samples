---
# Settings shared by all hosts. Credentials are not stored here: point
# RSC_SERVICE_ACCOUNT_FILE at the service account JSON downloaded from RSC
# (or set rubrik_rsc_service_account_file / the rubrik_rsc_client_* variables,
# e.g. in an ansible-vault encrypted vault.yml next to this file).

# rubrik_rsc_service_account_file: ~/.rubrik/rsc-service-account.json
rubrik_rsc_validate_certs: true
