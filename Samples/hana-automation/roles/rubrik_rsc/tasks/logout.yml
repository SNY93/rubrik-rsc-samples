---
- name: Revoke RSC session
  ansible.builtin.uri:
    url: "{{ rubrik_rsc_url }}/api/session"
    method: DELETE
    headers:
      Authorization: "Bearer {{ rubrik_rsc_token }}"
    validate_certs: "{{ rubrik_rsc_validate_certs }}"
    timeout: "{{ rubrik_rsc_timeout }}"
    status_code: [200, 204]
  register: __rubrik_rsc_logout
  # The token expires on its own; never fail the run on logout.
  failed_when: false
  changed_when: __rubrik_rsc_logout.status in [200, 204]
  when: rubrik_rsc_token is defined
  delegate_to: localhost
  become: false
  no_log: true
